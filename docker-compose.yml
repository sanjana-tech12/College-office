version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: college_tracker_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: college_tracker_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/college_tracker
      - PORT=3000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
    name: college_tracker_mongo_data
