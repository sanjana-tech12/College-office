<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - College Office Request Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>College Office Tracker</h1>
        <p>Sign in to your account</p>
      </div>

      <div id="alertBox"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="student@college.edu or staff@college.edu"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>

      <div class="alert alert-info mt-3" style="font-size: 0.8rem; flex-direction: column; align-items: flex-start;">
        <strong>Demo Staff Credentials:</strong>
        <div>Email: <code>staff@college.edu</code></div>
        <div>Password: <code>Staff@123</code></div>
      </div>

      <div class="text-center mt-3" style="font-size: 0.875rem;">
        New student? <a href="register.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Register here</a>
      </div>

      <div class="text-center mt-2" style="font-size: 0.825rem; border-top: 1px solid var(--border); padding-top: 0.75rem;">
        Staff Member? <a href="http://localhost:3000/staff.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">Go to Staff Portal (http://localhost:3000/staff.html) &rarr;</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
