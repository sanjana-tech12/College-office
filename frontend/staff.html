<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Portal - College Office Request Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="staff.html" class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
      College Office Staff Dashboard
    </a>
    <div class="nav-user">
      <div class="user-badge" id="staffBadge">Loading...</div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <main class="container">
    <div class="card">
      <div class="card-title">
        <span>Request Management</span>
        <span id="requestsCount" style="font-size: 0.85rem; color: #64748b; font-weight: normal;"></span>
      </div>

      <!-- Filters & Search Toolbar -->
      <div class="toolbar">
        <div>
          <label class="form-label" for="statusFilter" style="margin-bottom: 0.2rem; font-size: 0.775rem;">Status Filter</label>
          <select id="statusFilter" class="form-control" onchange="loadAllRequests()">
            <option value="all">All Statuses</option>
            <option value="Submitted">Submitted</option>
            <option value="In Progress">In Progress</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
            <option value="Ready for Collection">Ready for Collection</option>
          </select>
        </div>

        <div>
          <label class="form-label" for="searchInput" style="margin-bottom: 0.2rem; font-size: 0.775rem;">Search</label>
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Search REQ-ID, Name, Roll No..."
          >
        </div>

        <div style="align-self: flex-end; display: flex; gap: 0.5rem;">
          <button class="btn btn-primary btn-sm" onclick="loadAllRequests()">Search</button>
          <button class="btn btn-secondary btn-sm" onclick="resetFilters()">Reset</button>
        </div>
      </div>

      <div id="tableAlert"></div>

      <!-- Requests Table -->
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Request ID</th>
              <th>Student</th>
              <th>Request Type</th>
              <th>Description</th>
              <th>Date</th>
              <th>Status</th>
              <th>Remarks</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="staffTableBody">
            <tr>
              <td colspan="8" class="text-center" style="padding: 2.5rem;">Loading requests...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Update Status Modal -->
  <div class="modal-overlay" id="updateModal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Update Request Status</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>

      <form id="updateStatusForm">
        <div class="modal-body">
          <div id="modalAlert"></div>

          <div class="info-grid">
            <div class="info-item">
              <span>Request ID</span>
              <span id="modalRequestId" class="req-id-tag">-</span>
            </div>
            <div class="info-item">
              <span>Current Status</span>
              <span id="modalCurrentStatus">-</span>
            </div>
            <div class="info-item">
              <span>Student</span>
              <span id="modalStudentName">-</span>
            </div>
            <div class="info-item">
              <span>Service Type</span>
              <span id="modalRequestType">-</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="modalNextStatus">Next Allowed Status</label>
            <select id="modalNextStatus" class="form-control" required></select>
            <div class="form-hint" id="statusFlowHelp">Status transitions strictly follow institutional workflow.</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="modalRemarks">Remarks / Instructions for Student</label>
            <textarea
              id="modalRemarks"
              class="form-control"
              placeholder="e.g. Please bring original ID card to Counter 4 between 2 PM - 4 PM."
            ></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" id="modalSaveBtn" class="btn btn-primary">Update Request</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/staff.js"></script>
</body>
</html>
